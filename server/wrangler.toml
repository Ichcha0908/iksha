name = "iks-chat"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
# The website origins allowed to call this Worker (comma-separated).
# Change this to where your site is published, e.g. GitHub Pages:
ALLOWED_ORIGINS = "https://iks.theiksha.org,https://ichcha0908.github.io"
# Optional: a different model on OpenRouter. The default is
# "anthropic/claude-sonnet-5.5"; "anthropic/claude-haiku-5.5" costs about a
# twentieth as much (answers are a little less polished).
# MODEL = "anthropic/claude-sonnet-5.5"
# Optional: "off" stops Claude from searching the web (answers then come from
# the site's data and Claude's own knowledge only).
# WEB_SEARCH = "off"

# Feedback storage (visitors' corrections and new information).
# Create it once with:  npx wrangler kv namespace create FEEDBACK
# then paste the id it prints below and remove the # signs.
# [[kv_namespaces]]
# binding = "FEEDBACK"
# id = "paste-the-id-here"


# Organisation listings ("List your organisation"). Create it once with:
#   npx wrangler kv namespace create LISTINGS
# then paste the id it prints below and remove the # signs.
[[kv_namespaces]]
binding = "LISTINGS"
id = "ea4e84ee39204d4fbdb94739d5934099"
